<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сайт в разработке</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #09090b;
            color: #fafafa;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            overflow: hidden;
        }

        .alert-container {
            width: 100%;
            max-width: 480px;
        }

        .alert {
            background-color: #18181b;
            border: 1px solid #27272a;
            border-radius: 0.5rem;
            padding: 1rem;
            display: flex;
            align-items: flex-start;
            gap: 0.75rem;
            opacity: 0;
            transform: translateY(20px);
            animation: slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }

        .alert:hover {
            border-color: #3f3f46;
            box-shadow: 0 0 24px rgba(255, 255, 255, 0.04);
        }

        .alert-icon {
            flex-shrink: 0;
            width: 1rem;
            height: 1rem;
            color: #fafafa;
            margin-top: 0.125rem;
            animation: pulse 2.5s infinite ease-in-out;
        }

        .alert-content {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }

        .alert-title {
            font-size: 0.875rem;
            font-weight: 600;
            line-height: 1.25;
            letter-spacing: -0.01em;
        }

        .alert-description {
            font-size: 0.875rem;
            color: #a1a1aa;
            line-height: 1.5;
        }

        @keyframes slideUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
                opacity: 1;
            }
            50% {
                transform: scale(1.15);
                opacity: 0.7;
            }
        }
    </style>
</head>
<body>

    <div class="alert-container">
        <div class="alert">
            <svg class="alert-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="12" y1="16" x2="12" y2="12"></line>
                <line x1="12" y1="8" x2="12.01" y2="8"></line>
            </svg>
            
            <div class="alert-content">
                <h5 class="alert-title">Сайт в разработке</h5>
                <div class="alert-description">
                    Мы усердно работаем над созданием чего-то нового и крутого. Пожалуйста, заходите немного позже!
                </div>
            </div>
        </div>
    </div>

</body>
</html>
